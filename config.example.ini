; ---------------------------------------------------------------------------
; RackMonitor - Le Potato -> analog CRT
; ---------------------------------------------------------------------------

[display]
framebuffer = /dev/fb0
width  = 720
height = 576
fps    = 10
; true = crash on a missing PNG instead of drawing an X placeholder
strict_assets = false
; true = hide zones 1/2/4 completely when gameserver is unreachable
; false = keep them but show "--"
offline_blank_zones = false

[monitor]
host           = GAMESERVER_IP
port           = 9100
poll_interval  = 5
timeout        = 3
; consecutive failed scrapes before we declare gameserver unreachable
fail_threshold = 2

[services]
; display key = systemd unit on gameserver.
; ADDING A GAME: add one line here, drop <key>.png in the assets dir, restart.
; Nothing else in this file needs to change - the standby grid re-solves itself
; and artwork is found via logo_pattern below.
; Order = priority, if more than one is somehow active.
ark  = asa-server.service
rust = rust-server.service
sotf = sotf-server.service
; valheim  = valheim-server.service
; palworld = palworld-server.service

[assets]
background   = /opt/rackmonitor/assets/background.png
offline_icon = /opt/rackmonitor/assets/offline.png
idle_icon    = /opt/rackmonitor/assets/idle.png

; Game artwork is resolved from the [services] key. Add "valheim" to [services],
; drop valheim.png here, done - no edit to this section.
logo_pattern    = /opt/rackmonitor/assets/{key}.png
; Optional hand-desaturated standby art. If a file is missing, the main logo is
; reused (scaled + dimmed), so this is purely opt-in, per game.
standby_pattern = /opt/rackmonitor/assets/{key}_standby.png

; Per-game overrides beat both patterns, if you ever need an odd filename:
; logo_sotf = /opt/rackmonitor/assets/sons_of_the_forest_v2.png

[text]
font          = /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
value_size    = 32
label_size    = 15
; keep off pure white (#FFFFFF blooms and rings on composite)
value_color   = #DCDCC8
label_color   = #909090
outline_color = #0A0A0A
outline_width = 2

[icon]
width    = 160
height   = 160
center_x = 360
center_y = 288
bob_amplitude      = 10
bob_speed          = 0.05
shadow_offset_x    = 6
shadow_offset_y    = 8
shadow_opacity     = 120
shake_amplitude    = 8
shake_duration     = 0.5
shake_interval_min = 4
shake_interval_max = 9

; --- Zones ------------------------------------------------------------------
; Boxes sit inside the ~5% action-safe area of a 720x576 PAL raster.
; Run `monitor.py --calibrate` and nudge these until nothing is cut off.

[zone1]
; top-left : machine uptime
label   = MACHINE UP
width   = 190
height  = 96
x       = 40
y       = 40
label_y = 26
value_y = 66
; plate = /opt/rackmonitor/assets/plate.png

[zone2]
; top-right : uptime of the running game service
label   = SERVICE UP
width   = 190
height  = 96
x       = 490
y       = 40
label_y = 26
value_y = 66
; plate = /opt/rackmonitor/assets/plate.png

[zone3]
; bottom-left : the two games that are NOT running (hidden when unreachable)
label        = STANDBY
width        = 190
height       = 96
x            = 40
y            = 440
label_y      = 16
icon_opacity = 110
; The grid auto-solves for however many games are in [services]: it picks the
; rows/cols that make the icons as big as possible, capped at icon_size_max.
; If they'd end up smaller than icon_size_min it drops the extras and draws a
; "+N" badge instead - that's your cue to widen this zone.
icon_size_max = 64
icon_size_min = 26
icon_gap      = 12
icon_pad      = 8
; plate = /opt/rackmonitor/assets/plate.png

[zone4]
; bottom-right : total RAM usage %
label   = RAM
width   = 190
height  = 96
x       = 490
y       = 440
label_y = 18
value_y = 52
bar            = true
bar_height     = 10
bar_y          = 76
bar_warn       = 75
bar_crit       = 90
bar_color_ok   = #54B054
bar_color_warn = #C8A030
bar_color_crit = #C04040
; plate = /opt/rackmonitor/assets/plate.png
